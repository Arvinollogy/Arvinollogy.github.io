<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>درباره من | Arvinology</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f5f0;
      color: #171717;
      font-family: 'Vazirmatn', sans-serif;
      line-height: 2.1;
      padding: 0 24px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 40px 0 90px;
    }

    /* منو و سربرگ */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      margin-bottom: 70px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
      color: #171717;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: #000;
      font-weight: 600;
    }

    /* عنوان صفحه */
    .page-tag {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      letter-spacing: 4px;
      color: #7a6e5f;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .page-title {
      text-align: center;
      font-size: 2.6rem;
      font-weight: 900;
      margin-bottom: 50px;
    }

    /* متن‌های بیوگرافی */
    .about-content {
      max-width: 700px;
      margin: 0 auto 70px;
    }

    .about-content p {
      font-size: 1.08rem;
      color: #333;
      text-align: center;
      margin-bottom: 35px;
      line-height: 2.2;
    }

    /* کادر ارتباط */
    .contact-card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 12px;
      padding: 45px 30px;
      text-align: center;
      scroll-margin-top: 50px;
    }

    .contact-card h2 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .contact-card p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .contact-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 12px 26px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-dark {
      background: #171717;
      color: #ffffff;
    }

    .btn-dark:hover {
      opacity: 0.9;
    }

    .btn-outline {
      border: 1.5px solid #171717;
      color: #171717;
    }

    .btn-outline:hover {
      background: #171717;
      color: #ffffff;
    }

    }

    footer {

      font-size: 0 نقاشی برام فقط ساختن یک تصویر نیست؛ بیشتر از همه، رابطه‌سازی با خاطره‌ها و تجربه‌هایی که برام معنا دارن.
        </p>
        <p>
          در این مسیر، فرهنگ و هویت ایرانی همیشه یکی از مهم‌ترین منابع الهام بوده. چیزی که دنبالش می‌کنم، تبدیل کردن نمادها، داستان‌ها و جزئیاتی‌ست که شاید هر روز از کنارشون رد بشیم، ولی هنوز حرفی برای گفتن داشته باشن.

        <p>

        </p>

    <footer>

</body>
