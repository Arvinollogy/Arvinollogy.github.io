<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');

    * {

      margin: 0;
      padding: 0;
    }

    body {
      background: #f7f5f0;
      color: #171717;
      font-family: 'Vazirmatn', sans-serif;
      line-height: 2.1;
      padding: 0 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 0 90px;
    }

    /* هدر */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      margin-bottom: 80px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
      color: #171717;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #555;
      margin-right: 25px;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: #000;
      font-weight: 600;
    }

    /* سربرگ صفحه */
    .page-tag {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      letter-spacing: 4px;
      color: #7a6e5f;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .page-title {
      text-align: center;
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 60px;
    }

    /* متن‌های درباره من */
    .about-text p {
      font-size: 1.08rem;
      color: #333;
      text-align: center;
      max-width: 720px;
      margin: 0 auto 45px;
    }

    .about-text p:last-of-type {
      margin-bottom: 90px;
    }

    /* بخش ارتباط */
    .contact-section {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 14px;
      padding: 50px;
      text-align: center;
      scroll-margin-top: 50px;
    }

    .contact-section h2 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .contact-section p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 30px;
      line-height: 1.9;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .contact-btn {
      display: inline-block;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .contact-btn.primary {
      background: #171717;
      color: #ffffff;
    }

    .contact-btn.primary:hover {
      opacity: 0.9;
    }

    .contact-btn.secondary {
      border: 1.5px solid #171717;
      color: #171717;
    }
